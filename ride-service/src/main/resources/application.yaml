

spring:
  application:
    name: ride-service
server:
  port: 8083

#MYSQL database

  datasource:
    url: jdbc:mysql://localhost:3036/uberapp
    username: root
    password:
    driver-class-name: com.mysql.cj.jdbc.Driver


#JPA
jpa:
  hibernate:
    ddl-auto: update
  show-sql: true
  properties:
    hibernate:
      dialect: org.hibernate.dialect.MySQLDialect


#KAFKA
kafka:
  bootstrap-servers: localhost:9092
  producer:
    key-serializer: org.apache.kafka.common.serialization.StringSerializer
    value-serializer: org.springframework.kafka.support.serializer.jsonSerializer

#Actuator

management:
  endpoint:
    web:
      exposure:
        include: health,info





